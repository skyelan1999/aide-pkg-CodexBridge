<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Bridge</title>
<style>:root{color-scheme:light dark;--bg:#f6f8fb;--panel:#fff;--fg:#26364b;--muted:#64748b;--line:#d8e1ed;--accent:#476c93}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:28px;margin:0}h2{font-size:17px}small,p{color:var(--muted)}section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0}button{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:9px 16px;border-radius:9px;cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}select{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:8px;border-radius:8px}.actions{display:flex;gap:10px;flex-wrap:wrap}pre{overflow:auto;padding:14px;background:var(--bg);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}code{font-size:12px}li{margin:10px 0}.pill{font-size:11px;letter-spacing:.1em;color:var(--accent)}#status{white-space:pre-wrap;overflow-wrap:anywhere}a{color:var(--accent)}@media(prefers-color-scheme:dark){:root{--bg:#131d28;--panel:#1c2938;--fg:#e1e9f3;--muted:#a6b4c8;--line:#34475d;--accent:#9db9dc}}@media(max-width:500px){main{padding:18px 12px}section{padding:16px}header{align-items:start}h1{font-size:23px}}</style>
<main><header><div><div class="pill">LOCAL MODEL ADAPTER · 0.1.1</div><h1>Codex Bridge</h1></div><button id="lang" aria-label="切换语言 / Change language">中文</button></header><p id="intro"></p>
<section><h2 id="connectTitle"></h2><div class="actions"><button id="check"></button><button id="models"></button></div><p id="status" role="status" aria-live="polite"></p><pre id="output" hidden></pre></section>
<section><h2 id="guideTitle"></h2><p id="keyHelp"></p><label id="hostLabel" for="hostOS"></label> <select id="hostOS"><option value="win32">Windows (CMD)</option><option value="darwin">macOS (Terminal)</option><option value="linux">Linux (Terminal)</option></select><div class="actions" style="margin-top:12px"><button id="stepInstall"></button><button id="stepKey"></button><button id="stepStart"></button><button id="stepStop"></button><button id="stepUninstall"></button></div><p id="lifecycleNote"></p><pre id="lifecycleCommand"></pre><p id="pluginRemoval"></p><ol id="guide"></ol></section><section><h2 id="scopeTitle"></h2><p id="scope"></p></section></main>
<script>'use strict';
// Bundle this source into a plugin HTML. Never load parent credentials or arbitrary host URLs.
(function(){
 function create(pluginId){
  if(typeof pluginId!=='string'||!/^[A-Za-z0-9_-]{1,64}$/.test(pluginId))throw Error('Invalid plugin id');
  let port=null,tools=[],capabilities=[],next=0,connecting=null,settle=null,closed=false;const pending=new Map(),listeners=new Set();
  const revoke=reason=>{closed=true;port?.close();port=null;for(const p of pending.values()){clearTimeout(p.timer);p.reject(Error(reason));}pending.clear();if(settle){settle.reject(Error(reason));clearTimeout(settle.timer);settle=null;}window.removeEventListener('message',receive);};
  function receive(e){const m=e.data;if(closed||port||e.source!==window.parent||m?.type!=='aide.workbench.connect'||m.protocol!==1||m.pluginId!==pluginId||!Array.isArray(m.tools)||m.tools.some(x=>typeof x!=='string')||e.ports?.length!==1)return;
   port=e.ports[0];tools=m.tools.slice();capabilities=Array.isArray(m.capabilities)?m.capabilities.filter(x=>typeof x==='string').slice(0,16):[];port.onmessage=event=>{const value=event.data;if(value?.event==='scope.revoked'){revoke('Host scope revoked; verify effects before retry');for(const listener of listeners){try{listener(value);}catch(_){}}return;}if(value?.event){for(const listener of listeners)listener(value);return;}const p=pending.get(value?.requestId);if(!p)return;pending.delete(value.requestId);clearTimeout(p.timer);if(value.status==='error')p.reject(Error(value.error||'Host call failed'));else p.resolve(value);};port.start();clearTimeout(settle?.timer);settle?.resolve({protocol:1,tools:tools.slice(),capabilities:capabilities.slice()});settle=null;
  }
  window.addEventListener('message',receive);
  function connect(){if(closed)return Promise.reject(Error('Client closed'));if(port)return Promise.resolve({protocol:1,tools:tools.slice(),capabilities:capabilities.slice()});if(!connecting){connecting=new Promise((resolve,reject)=>{settle={resolve,reject,timer:setTimeout(()=>revoke('Host bridge unavailable'),10000)};});window.parent.postMessage({type:'aide.workbench.ready',protocol:1,requestIds:'monotonic'},'*');}return connecting;}
  async function request(method,body){await connect();if(closed||!port)throw Error('Bridge closed');if(pending.size)throw Error('A call is already pending');const requestId='r_'+(++next);return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(requestId);reject(Error('Reply timeout; outcome uncertain, do not automatically retry'));},320000);pending.set(requestId,{resolve,reject,timer});try{port.postMessage({protocol:1,requestId,method,...body});}catch(e){pending.delete(requestId);clearTimeout(timer);reject(e);}});}
  return {connect,
   workflow:args=>request('workflow.control',{arguments:args}),
   capture:args=>request('capture.control',{arguments:args}),
   captureNetwork:args=>request('capture.network',{arguments:args}),
   projectMessages:args=>request('project.messages',{arguments:args}),
   fileTarget:path=>request('file.target',{arguments:{path}}),
   saveFile:(path,content,hash)=>request('file.save',{arguments:{path,content,hash}}),
   documentInfo:(asset='',options={})=>request('document.info',{arguments:{asset,metadataOnly:options.metadataOnly===true}}),
   readDocument:(args={})=>request('document.read',{arguments:args}),
   pluginAssetInfo:(asset,options={})=>request('document.package.info',{arguments:{asset,metadataOnly:options.metadataOnly===true}}),
   readPluginAsset:(args={})=>request('document.package.read',{arguments:args}),
   failDocumentPreview:()=>request('document.error',{arguments:{}}),
   setDocumentDirty:dirty=>request('document.dirty',{arguments:{dirty:dirty===true}}),
   abortDocumentSave:()=>request('document.save.abort',{arguments:{}}),
   beginDocumentSave:(size,version)=>request('document.save.begin',{arguments:{size,version}}),
   writeDocumentChunk:(offset,bytes)=>{if(!(bytes instanceof Uint8Array)||bytes.byteLength>524288)throw Error('Expected Uint8Array of at most 512KiB');let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));return request('document.save.chunk',{arguments:{offset,data:btoa(binary)}});},
   requestDocumentSave:()=>request('document.save.request',{arguments:{}}),

   async saveDocument(bytes,version){if(!(bytes instanceof Uint8Array))throw Error('Expected Uint8Array');await request('document.save.begin',{arguments:{size:bytes.byteLength,version}});for(let offset=0;offset<bytes.byteLength;offset+=524288){const chunk=bytes.subarray(offset,offset+524288);let binary='';for(let i=0;i<chunk.length;i+=8192)binary+=String.fromCharCode(...chunk.subarray(i,i+8192));await request('document.save.chunk',{arguments:{offset,data:btoa(binary)}});}return request('document.save.request',{arguments:{}});},
   async call(tool,args={},attachments=[]){await connect();if(!tools.includes(tool))throw Error('Tool not declared by this workbench');return request('tool.call',{tool,arguments:args,attachments});},proposalStatus:proposalId=>request('proposal.status',{proposalId}),onEvent(fn){listeners.add(fn);return()=>listeners.delete(fn);},close(){revoke('Client closed; verify effects before retry');}};
 }
 window.AideWorkbenchClient={create};
})();
</script><script>
'use strict';let zh=false,busy=false;const client=AideWorkbenchClient.create('codex-bridge');
const texts={en:{intro:'Connect Aide to Codex installed on your own host. The plugin guides setup; a separate local service performs protocol conversion.',connectTitle:'Connection & model catalog',check:'Check connection',models:'Read model catalog',guideTitle:'Get started',scopeTitle:'What this bridge does',scope:'Text, SSE, JSON output, function-tool handoff and bounded concurrent requests. Each request has an isolated temporary Codex thread. Aide owns history, tools and approval. Images/audio and desktop chat inheritance are not supported. Model catalog ≠ entitlement; successful inference is the access test.',guide:['Install Node.js 18+ and the official Codex CLI on the host. Run <code>codex login</code> there. No login tokens are copied by this plugin.','Extract the plugin ZIP. Windows: <code>install.cmd</code>; macOS: <code>sh install.command</code>; Linux: <code>sh install.sh</code>. Open the printed installation directory.','Run <code>node manage.cjs doctor</code>. Edit <code>config.json</code> if needed, then run <code>start.cmd</code> or <code>sh start.sh</code>. Keep that terminal open. Ctrl+C stops only the bridge.','Native Aide: <code>http://127.0.0.1:8787/v1</code>. Docker Desktop Aide: <code>http://host.docker.internal:8787/v1</code>. Docker access may require explicit host binding/firewall configuration; see README. The plugin never changes networking.','Run <code>node manage.cjs key</code> locally. Put the generated bridge key in Aide model-provider settings (OpenAI compatible / Chat Completions). Optionally set the same diagnostic key in plugin settings for catalog checks. Never paste a key into chat.','Choose a model from the authenticated catalog, then send a small test message in Aide. No provider is changed automatically. Ten concurrent slots share the same account quota; they do not guarantee tenfold speed.']},zh:{intro:'把宿主机上的 Codex 接入 Aide。插件负责连接检查与配置引导，独立本地服务负责协议转换。',connectTitle:'连接与模型目录',check:'检查连接',models:'读取模型目录',guideTitle:'如何使用',scopeTitle:'能力边界',scope:'支持文本、SSE、JSON 输出、函数工具交接和有界并发。每次请求使用独立临时 Codex 会话，历史、工具及审批由 Aide 管理。不继承桌面聊天，不支持图片和音频。模型目录不代表调用权限，实际推理成功才算通过。',guide:['宿主机安装 Node.js 18+ 和官方 Codex CLI，并在宿主机执行 <code>codex login</code>。插件不复制登录令牌。','解压插件 ZIP。Windows 运行 <code>install.cmd</code>；macOS 运行 <code>sh install.command</code>；Linux 运行 <code>sh install.sh</code>。进入输出的安装目录。','运行 <code>node manage.cjs doctor</code>，按需编辑 <code>config.json</code>，再运行 <code>start.cmd</code> 或 <code>sh start.sh</code>。保持终端打开，Ctrl+C 停止桥接。','原生 Aide：<code>http://127.0.0.1:8787/v1</code>；Docker Desktop：<code>http://host.docker.internal:8787/v1</code>。容器访问可能需要手工设置监听和防火墙，详见 README；插件不自动改变网络。','在安装目录运行 <code>node manage.cjs key</code>，把生成的桥接密钥填到 Aide 模型提供商设置（OpenAI 兼容 / Chat Completions）。插件设置里的诊断密钥仅用于读取目录，不要把密钥发到聊天中。','从认证目录选择模型，再在 Aide 发一条简短测试消息。插件不自动更改提供商。十路并发共享账号额度，不等于十倍速度。']}};
let lifecycleStep='install';
const lifecycleCommands={
 win32:{install:'install.cmd',key:String.raw`node "%LOCALAPPDATA%\aide-codex-bridge\manage.cjs" key`,start:String.raw`"%LOCALAPPDATA%\aide-codex-bridge\start.cmd"`,uninstall:String.raw`"%LOCALAPPDATA%\aide-codex-bridge\uninstall.cmd"`},
 darwin:{install:'sh install.command',key:'node "$HOME/Library/Application Support/aide-codex-bridge/manage.cjs" key',start:'sh "$HOME/Library/Application Support/aide-codex-bridge/start.command"',uninstall:'sh "$HOME/Library/Application Support/aide-codex-bridge/uninstall.command"'},
 linux:{install:'sh install.sh',key:'node "${XDG_DATA_HOME:-$HOME/.local/share}/aide-codex-bridge/manage.cjs" key',start:'sh "${XDG_DATA_HOME:-$HOME/.local/share}/aide-codex-bridge/start.sh"',uninstall:'sh "${XDG_DATA_HOME:-$HOME/.local/share}/aide-codex-bridge/uninstall.sh"'}
};
function paintLifecycle(){
 const labels=zh?{install:'安装宿主组件',key:'获取密钥',start:'启动',stop:'停止',uninstall:'卸载宿主组件'}:{install:'Install host',key:'Get key',start:'Start',stop:'Stop',uninstall:'Uninstall host'};
 document.getElementById('hostLabel').textContent=zh?'运行 Codex 的宿主系统：':'Codex host operating system:';
 for(const [step,label]of Object.entries(labels)){const b=document.getElementById('step'+step[0].toUpperCase()+step.slice(1));b.textContent=label;b.setAttribute('aria-pressed',String(step===lifecycleStep));}
 const notes=zh?{install:'在宿主机解压 ZIP，进入解压目录执行。不要在 Docker 内执行宿主安装；此页不会自动运行命令。自选目录可用 node manage.cjs install "目标目录"。',key:'先安装宿主组件，再在宿主终端执行。输出只填 API Key / 可选诊断密钥，不发到聊天里。自选目录请运行该目录的 get-key 入口。',start:'在宿主终端执行并保持终端打开。成功后回到上方“检查连接”。目录不同请运行实际安装目录中的 start 入口。',stop:'在运行桥接的宿主终端按 Ctrl+C。停止后可点击“检查连接”确认不再可达。不要停止 Aide 本身。',uninstall:'先停止桥接，再在宿主终端执行。只删除本组件程序；保留 config.json、data/bridge.key 和目录标记，便于重新安装。不会卸载 Node、Codex CLI 或退出账号。自选目录运行该目录的 uninstall 入口。'}:{install:'Extract the ZIP on the Codex host and run from that extracted directory. Do not install the host component inside Docker. This page does not execute commands. Custom target: node manage.cjs install "target directory".',key:'Install the host component first, then run in the host terminal. Put the output only in API Key / optional diagnostic key, never in chat. Use the installed get-key launcher for a custom target.',start:'Run in the host terminal and keep it open. Then use Check connection above. For custom paths, use that installation’s start launcher.',stop:'Press Ctrl+C in the host terminal running the bridge, then Check connection to verify it is no longer reachable. Do not stop Aide itself.',uninstall:'Stop the bridge first, then run in the host terminal. Removes only component program files; preserves config.json, data/bridge.key and the directory marker for reinstall. Does not remove Node/Codex or sign out. For custom paths use that installation’s uninstall launcher.'};
 document.getElementById('lifecycleNote').textContent=notes[lifecycleStep];
 document.getElementById('lifecycleCommand').textContent=lifecycleStep==='stop'?'Ctrl+C':lifecycleCommands[document.getElementById('hostOS').value][lifecycleStep];
 document.getElementById('pluginRemoval').textContent=zh?'卸载 Aide 插件本身：插件面板 → 已安装 → Codex Bridge → 卸载。它与宿主组件分开管理；移除插件不会停止宿主桥接。':'To remove the Aide plugin itself: Plugins → Installed → Codex Bridge → Uninstall. It is managed separately; removing the plugin does not stop the host bridge.';
}
document.getElementById('hostOS').value=/Mac/i.test(navigator.platform)?'darwin':/Win/i.test(navigator.platform)?'win32':'linux';
document.getElementById('hostOS').onchange=paintLifecycle;
for(const step of ['install','key','start','stop','uninstall'])document.getElementById('step'+step[0].toUpperCase()+step.slice(1)).onclick=()=>{lifecycleStep=step;paintLifecycle();};
function paint(){document.getElementById('keyHelp').textContent=zh?'先在运行 Codex 的宿主机安装，再按对应系统获取密钥。仅导入 Aide 插件不会安装宿主服务。':'Install on the Codex host first, then use the command for that OS. Importing the Aide plugin alone does not install the host service.';paintLifecycle();const t=texts[zh?'zh':'en'];document.documentElement.lang=zh?'zh-CN':'en';for(const id of ['intro','connectTitle','check','models','guideTitle','scopeTitle','scope'])document.getElementById(id).textContent=t[id];document.getElementById('lang').textContent=zh?'English':'中文';document.getElementById('guide').innerHTML=t.guide.map(x=>'<li>'+x+'</li>').join('');}
async function run(tool){if(busy)return;busy=true;for(const id of ['check','models'])document.getElementById(id).disabled=true;const o=document.getElementById('output');o.hidden=true;o.textContent='';document.getElementById('status').textContent=zh?'检查中…':'Checking…';try{const r=await client.call(tool,{});if(r.status==='proposal')throw Error('Approval required in Aide');const raw=r.result??r.content??r;const value=typeof raw==='string'?JSON.parse(raw):raw;o.textContent=JSON.stringify(value,null,2);o.hidden=false;document.getElementById('status').textContent=zh?'检查完成（不代表推理验证通过）':'Check complete (not inference acceptance)';}catch(e){document.getElementById('status').textContent=e.message;}finally{busy=false;for(const id of ['check','models'])document.getElementById(id).disabled=false;}}
document.getElementById('lang').onclick=()=>{zh=!zh;paint()};document.getElementById('check').onclick=()=>run('codex_bridge_connection_info');document.getElementById('models').onclick=()=>run('codex_bridge_models');paint();
</script></html>
