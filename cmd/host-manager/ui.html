<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Bridge</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f9;--panel:#fff;--fg:#263549;--muted:#64748b;--line:#dbe2eb;--accent:#486d95;--bad:#b54747}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 system-ui,sans-serif}main{max-width:840px;margin:auto;padding:36px 24px}header,.actions{display:flex;gap:12px;align-items:center;justify-content:space-between}h1{font-size:26px;margin:0}h2{font-size:17px;margin:0 0 12px}p,small{color:var(--muted)}.caption{font-size:11px;letter-spacing:.12em;color:var(--muted)}section{padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:20px 0}button,input,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 13px}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#mainOperations{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:22px}#mainOperations button{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;min-height:100px;padding:14px 4px}svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}#install{background:var(--accent);color:var(--panel);border-color:var(--accent)}#result{min-height:24px;margin-bottom:0}#result.error{color:var(--bad)}#state{font-weight:600}label{display:block;color:var(--muted);margin:14px 0 6px}input,select{width:100%}code,pre{overflow-wrap:anywhere;white-space:pre-wrap}.secondary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.secondary input{flex:1;min-width:150px}details{margin-top:22px}summary{cursor:pointer;color:var(--muted)}.advanced-group{padding:18px 0;border-bottom:1px solid var(--line)}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#131d29;--panel:#1d2a3a;--fg:#e0e8f1;--muted:#a5b4c7;--line:#34465b;--accent:#9bb7d5;--bad:#f0a5a5}}@media(max-width:600px){main{padding:24px 14px}section{padding:20px 16px}#mainOperations{grid-template-columns:repeat(2,minmax(0,1fr))}#key{grid-column:1/-1}h1{font-size:23px}}
</style>
<main><header><div><div class="caption">LOCAL HOST · __BRIDGE_VERSION__</div><h1>Codex Bridge</h1></div><button id="language" aria-label="切换语言 / Change language">English</button></header><p id="intro"></p>
<section><div id="state" role="status" aria-live="polite"></div><small id="environment"></small>
<div id="mainOperations" aria-label="主要操作 / Main operations">
<button id="install" data-action="install"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg><span></span></button>
<button id="start" data-action="start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4 12 8-12 8z"/></svg><span></span></button>
<button id="stop" data-action="stop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg><span></span></button>
<button id="uninstall" data-action="uninstall"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6m4-6v6"/></svg><span></span></button>
<button id="key"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="m12 12 9 9m-3-3 3-3m-6 0 3-3"/></svg><span></span></button>
</div><p id="result" role="status" aria-live="polite"></p><small id="offline"></small></section>
<section id="confirmation" role="alertdialog" aria-modal="false" aria-describedby="confirmText" hidden><p id="confirmText"></p><div class="secondary"><button id="cancelAction"></button><button id="confirmAction"></button></div></section>
<section id="provider" hidden><h2 id="providerTitle"></h2><p id="keyHint"></p><label id="keyLabel" for="bridgeKey"></label><input id="bridgeKey" type="password" readonly autocomplete="off"><label id="deployLabel" for="deployment"></label><select id="deployment"><option value="docker">Aide · Docker Desktop</option><option value="native">Aide · Native / 原生</option></select><label id="urlLabel" for="baseURL"></label><input id="baseURL" readonly></section>
<details id="advanced"><summary id="advancedTitle"></summary>
<div class="advanced-group"><h2 id="connectTitle"></h2><p id="connectHelp"></p><div class="secondary"><button id="generateCode"></button><input id="pairCode" readonly aria-label="一次性连接码 / One-time connection code"><button id="copyCode"></button></div><p id="pairStatus" role="status"></p><button id="revoke"></button></div>
<div class="advanced-group"><h2 id="diagnosticTitle"></h2><div class="secondary"><button id="doctor" data-action="doctor"></button><button id="repair" data-action="repair"></button></div><pre id="diagnostics"></pre></div>
<div class="advanced-group"><p id="closeHelp"></p><button id="quit"></button></div></details></main>
<script>
'use strict';let owner=location.hash.slice(1);history.replaceState(null,'','/');let busy=false,closed=false,expiry=0,pending=null,current={},zh=!/^en\b/i.test(navigator.language||'zh');
const el=id=>document.getElementById(id),labels={zh:{cancelAction:'取消',confirmAction:'确认',intro:'安装、启动、生成密钥，填入 Aide 即可使用。',install:'安装',start:'启动',stop:'停止',uninstall:'卸载',key:'生成密钥',offline:'程序已包含在安装包内，安装时不下载仓库源码。',providerTitle:'填入 Aide 模型设置',keyHint:'已有密钥会直接复用，不重置现有配置。仅填写到模型提供商设置，不要发送到聊天中。',keyLabel:'模型 API 密钥',deployLabel:'Aide 运行方式',urlLabel:'API 地址',advancedTitle:'更多设置',connectTitle:'从 Aide 插件控制本机（可选）',connectHelp:'手动使用上面五个按钮无需配对。需要在 Aide 插件里控制本机时，再生成一次性连接码，填入插件工作台；它不是模型 API 密钥。',generateCode:'生成连接码',copyCode:'复制连接码',revoke:'撤销插件管理连接',diagnosticTitle:'故障排查',doctor:'检查环境',repair:'修复启动器',closeHelp:'关闭这个网页不会停止桥接；退出管理器会停止它启动的桥接。',quit:'退出管理器',notInstalled:'尚未安装',running:'运行中',stopped:'已安装，已停止',external:'检测到其他方式启动的桥接，请先手动关闭一次。',environment:'运行需要 Node.js 18+ 和已登录的 Codex CLI。',missingNode:'未找到 Node.js 18+，请先安装。',missingCodex:'启动时将检查 Codex CLI；若失败，请在更多设置检查环境。',working:'正在处理…',done:'操作完成。',copied:'已有密钥已复制，现有配置不变。',created:'密钥已生成并复制。',selectKey:'请复制下方已选中的密钥。',installFirst:'请先安装。',pairReady:'连接码两分钟内有效，仅使用一次。',expired:'连接码已过期。',revoked:'插件管理连接已撤销。',reopen:'请重新双击打开宿主管理器。',closed:'管理器已退出。',removeConfirm:'卸载桥接程序？配置和密钥会保留。',quitConfirm:'退出管理器并停止它启动的桥接？',revokeConfirm:'撤销全部 Aide 插件管理连接？'},en:{cancelAction:'Cancel',confirmAction:'Confirm',intro:'Install, start and generate a key. Add it to Aide to begin.',install:'Install',start:'Start',stop:'Stop',uninstall:'Uninstall',key:'Generate key',offline:'Program files are included. Installation does not fetch repository source.',providerTitle:'Add to Aide model settings',keyHint:'An existing key is reused without resetting your configuration. Put it in provider settings only, never in chat.',keyLabel:'Model API key',deployLabel:'Aide deployment',urlLabel:'API URL',advancedTitle:'More settings',connectTitle:'Control this host from Aide (optional)',connectHelp:'The five local actions work without pairing. Generate a one-time code only if you also want controls inside the Aide plugin. It is not the model API key.',generateCode:'Generate connection code',copyCode:'Copy code',revoke:'Revoke plugin connections',diagnosticTitle:'Troubleshooting',doctor:'Check environment',repair:'Repair launchers',closeHelp:'Closing this page leaves the bridge running. Quitting the manager stops its owned bridge.',quit:'Quit manager',notInstalled:'Not installed',running:'Running',stopped:'Installed; stopped',external:'An externally started bridge is present. Close it manually once first.',environment:'Requires Node.js 18+ and a signed-in Codex CLI.',missingNode:'Node.js 18+ was not found. Install it first.',missingCodex:'Start will check Codex CLI. If it fails, use Check environment under More settings.',working:'Working…',done:'Completed.',copied:'Existing key copied. Configuration unchanged.',created:'Key generated and copied.',selectKey:'Copy the selected key below.',installFirst:'Install the host first.',pairReady:'Code expires in two minutes and works once.',expired:'Connection code expired.',revoked:'Plugin connections revoked.',reopen:'Reopen the native manager application.',closed:'Manager closed.',removeConfirm:'Remove bridge program files and retain settings and keys?',quitConfirm:'Quit manager and stop its owned bridge?',revokeConfirm:'Revoke all Aide plugin manager connections?'}};
const t=()=>labels[zh?'zh':'en'];
function controls(){for(const b of el('mainOperations').children)b.disabled=busy||closed||!!pending||((b.id==='install'||b.id==='uninstall')&&(current.running||current.externalBridge))||(b.id!=='install'&&!current.installed)||(b.id==='start'&&(current.running||current.externalBridge||!current.nodeFound))||(b.id==='stop'&&!current.running);for(const id of ['generateCode','copyCode','revoke','doctor','repair','quit'])el(id).disabled=busy||closed||!!pending}
function paint(){document.documentElement.lang=zh?'zh-CN':'en';el('language').textContent=zh?'English':'中文';for(const id of ['intro','offline','providerTitle','keyHint','keyLabel','deployLabel','urlLabel','advancedTitle','connectTitle','connectHelp','generateCode','copyCode','revoke','diagnosticTitle','doctor','repair','closeHelp','quit','cancelAction','confirmAction'])el(id).textContent=t()[id];for(const b of el('mainOperations').children)b.querySelector('span').textContent=t()[b.id];el('state').textContent=closed?t().closed:current.externalBridge?t().external:!current.installed?t().notInstalled:current.running?t().running:t().stopped;el('environment').textContent=current.installed&&!current.nodeFound?t().missingNode:current.installed&&!current.codexFound?t().missingCodex:t().environment;el('diagnostics').textContent=JSON.stringify(current,null,2);if(!el('provider').hidden)url();controls()}
function message(value,error=false){el('result').textContent=value;el('result').classList.toggle('error',error)}
async function api(route,body){const r=await fetch('/api/'+route,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+owner,'Content-Type':'application/json','X-Manager-Owner-UI':'1'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function refresh(){current=await api('status');paint()}
async function work(fn){if(busy||closed)return;busy=true;controls();message(t().working);try{await fn()}catch(e){message(owner?e.message:t().reopen,true)}finally{busy=false;if(!closed)try{await refresh()}catch(e){message(t().reopen,true)}controls()}}
function ask(text,fn){if(busy||closed||pending)return;pending=fn;el('confirmText').textContent=text;el('confirmation').hidden=false;controls();el('cancelAction').focus()}
function cancel(){pending=null;el('confirmation').hidden=true;controls()}
el('cancelAction').onclick=cancel;el('confirmAction').onclick=()=>{const fn=pending;cancel();fn?.()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pending)cancel()});
for(const b of document.querySelectorAll('[data-action]'))b.onclick=()=>{const action=b.dataset.action;const run=()=>work(async()=>{await api('action',{action});if(action==='uninstall'){el('bridgeKey').value='';el('provider').hidden=true}message(t().done)});if(action==='uninstall')ask(t().removeConfirm,run);else run()};
function url(){const port=current.port||8787;el('baseURL').value=(el('deployment').value==='docker'?'http://host.docker.internal:':'http://127.0.0.1:')+port+'/v1'}
el('deployment').onchange=url;
el('key').onclick=()=>work(async()=>{const d=await api('key',{});el('bridgeKey').value=d.bridgeKey;el('provider').hidden=false;url();try{await navigator.clipboard.writeText(d.bridgeKey);message(d.created?t().created:t().copied)}catch{el('bridgeKey').focus();el('bridgeKey').select();message(t().selectKey)}});
el('generateCode').onclick=()=>work(async()=>{const d=await api('pair-code',{});el('pairCode').value=d.code;expiry=Date.now()+d.expiresIn*1000;el('pairStatus').textContent=t().pairReady;message(t().done)});
el('copyCode').onclick=async()=>{try{await navigator.clipboard.writeText(el('pairCode').value)}catch{el('pairCode').focus();el('pairCode').select()}};
el('revoke').onclick=()=>ask(t().revokeConfirm,()=>work(async()=>{await api('revoke-clients',{});expiry=0;el('pairCode').value='';el('pairStatus').textContent=t().revoked;message(t().done)}));
el('quit').onclick=()=>ask(t().quitConfirm,()=>work(async()=>{await api('quit',{});closed=true;owner='';expiry=0;el('pairCode').value='';el('bridgeKey').value='';el('provider').hidden=true;paint();message(t().closed)}));
el('language').onclick=()=>{zh=!zh;paint()};paint();refresh().catch(()=>message(t().reopen,true));setInterval(()=>{if(!busy&&!closed)refresh().catch(()=>{});if(expiry&&Date.now()>expiry){el('pairCode').value='';expiry=0;el('pairStatus').textContent=t().expired}},5000);
</script></html>
