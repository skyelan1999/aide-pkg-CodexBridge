<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Bridge</title>
<style>:root{color-scheme:light dark;--bg:#f6f8fb;--panel:#fff;--fg:#26364b;--muted:#64748b;--line:#d8e1ed;--accent:#476c93}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:27px;margin:0}h2{font-size:18px;margin-top:0}p,small{color:var(--muted)}section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;margin:18px 0}button,select,input{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:9px 13px;border-radius:8px}button{cursor:pointer}button:hover,a:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--accent);color:var(--panel)}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.state{padding:10px 14px;border-left:3px solid var(--accent);background:var(--panel)}a{color:var(--accent);text-decoration:none}#downloads{margin-top:14px}#downloads a{border:1px solid var(--line);border-radius:7px;padding:7px 10px}input{width:215px;letter-spacing:.1em}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}details{margin:18px 0}summary{cursor:pointer;color:var(--muted)}.caption{font-size:12px;letter-spacing:.07em;color:var(--muted)}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#131d28;--panel:#1c2938;--fg:#e1e9f3;--muted:#a6b4c8;--line:#34475d;--accent:#9db9dc}}@media(max-width:520px){main{padding:20px 12px}section{padding:18px}h1{font-size:23px}input{width:100%}}</style>
<main><header><div><div class="caption">CODEX BRIDGE · __BRIDGE_VERSION__</div><h1>Codex Bridge</h1></div><div class="actions"><button id="refresh" type="button"></button><button id="lang" aria-label="切换语言 / Change language">English</button></div></header><p id="intro"></p><p id="state" class="state" role="status" aria-live="polite"></p>
<section id="installStep"><h2 id="installTitle"></h2><p id="installHelp"></p><label id="osLabel" for="hostOS"></label> <select id="hostOS"><option value="windows">Windows</option><option value="darwin">macOS</option><option value="linux">Linux</option></select><div id="downloads" class="actions"></div><p id="installNote"></p></section>
<section id="pairStep"><h2 id="pairTitle"></h2><p id="pairHelp"></p><form id="pairForm"><div class="actions"><input id="code" type="text" autocomplete="off" spellcheck="false" maxlength="14" placeholder="ABCD-1234-EF56" aria-label="一次性连接码 / One-time connection code"><button class="primary" id="pair" type="submit"></button></div></form><p id="pairNote"></p></section>
<section><h2 id="hostTitle"></h2><p id="hostHelp"></p><div class="actions" id="hostActions"></div><p id="result" role="status" aria-live="polite"></p></section>
<section><h2 id="modelsTitle"></h2><p id="modelsHelp"></p><button id="models"></button><p id="catalog" role="status"></p><p id="providerHelp"></p></section>
<details id="advanced"><summary id="advancedTitle"></summary><p id="advancedHelp"></p><button id="disconnect"></button><pre id="details"></pre><p id="legacy" hidden></p><p id="scope"></p></details></main>
<script>/* HOST_CLIENT */</script><script>
'use strict';const client=AideWorkbenchClient.create('codex-bridge');let zh=!/^en\b/i.test(navigator.language||'zh'),busy=false,modelIDs=null,current={phase:'checking',paired:false};
const copy={zh:{intro:'把本机 Codex 接入 Aide。按下面三步连接，无需在插件设置中填写密钥。',installTitle:'1 · 安装宿主组件',installHelp:'第一次使用：下载与你的电脑匹配的管理器，解压后双击打开。更新前请先退出旧管理器，再打开新版。',osLabel:'Codex 所在电脑：',installNote:'Windows 10/11、Server 2016+（有桌面）、macOS 和 Linux。需要已有 Node.js 18+ 与已登录的 Codex CLI；不自动安装依赖或修改系统防护。',pairTitle:'2 · 连接 Aide',pairHelp:'在刚打开的宿主管理器里点击“生成连接码”，把一次性连接码填在这里。地址自动识别，无需复制长期管理密钥。',pair:'连接',refresh:'重新检查',pairNote:'连接码两分钟内有效，只能使用一次。这里只连接当前 Aide 后端，不切换模型或覆盖提供商。',hostTitle:'3 · 启动与维护',hostHelp:'启动、检查或维护本机桥接。未连接时请先完成连接步骤。',modelsTitle:'模型与测试',modelsHelp:'启动桥接后读取模型目录，确认当前账号能列出的模型。',models:'读取模型目录',providerHelp:'首次使用模型：在原生管理器点“复制模型 API Key”，只填到 Aide 的模型提供商加密设置中。无需再填一份诊断密钥。目录可用不代表推理已通过，请另发一条测试消息。',advancedTitle:'高级与故障排查',advancedHelp:'插件连接方式可保留“自动识别”。Docker Desktop 与原生部署会尝试对应的本地地址。旧版管理器不支持连接码，请安装与此插件同版的管理器；Linux Docker 需另行配置受控宿主访问。',disconnect:'断开此 Aide 的连接',scope:'支持文本、SSE、工具交接和有界并发。不继承 Codex 桌面聊天，不支持图片/音频；不会复制登录令牌、自动改提供商或防火墙。',legacy:'检测到旧版密钥设置。新版不会读取或转发这些字段；请在插件设置的文本视图移除 bridgeKey、managerKey。升级不会擅自修改旧配置。',checking:'正在检查本机连接…',manager_missing:'未找到新版宿主管理器，请先完成第 1 步。',unpaired:'已找到管理器，请完成第 2 步连接。',reconnect:'连接不可用，请确认管理器已打开，或重新生成连接码。',host_missing:'已连接。请点击“安装／更新”，然后启动。',host_stopped:'已连接，桥接未启动。',external_bridge:'检测到旧方式启动的桥接，请先关闭它，再由管理器启动。',ready:'桥接已运行。可读取模型目录；尚未进行推理测试。',working:'正在执行，请稍候…',done:'操作已完成。',paired:'连接成功。',modelResult:'可用目录：',noModels:'目录没有返回模型。',approval:'请先在 Aide 中确认操作；尚未执行。'},en:{intro:'Connect your local Codex to Aide in three steps. No keys belong in plugin settings.',installTitle:'1 · Install the host component',installHelp:'Download the manager for your computer, extract it and open the application. When updating, quit the older manager first, then open the new version.',osLabel:'Computer running Codex:',installNote:'Windows 10/11, Server 2016+ with an interactive desktop, macOS and Linux. Requires Node.js 18+ and a signed-in Codex CLI. Dependencies and OS protections are not changed.',pairTitle:'2 · Connect Aide',pairHelp:'In the native manager, choose Generate connection code and enter that one-time code here. Local addresses are detected automatically; no persistent manager key to copy.',pair:'Connect',refresh:'Check again',pairNote:'The code expires in two minutes and works once. This connects only the current Aide backend; it does not select a model or overwrite providers.',hostTitle:'3 · Start and maintain',hostHelp:'Start, inspect or maintain the local bridge. Complete connection before using these controls.',modelsTitle:'Models and testing',modelsHelp:'After starting the bridge, read the model catalog available to this account.',models:'Read model catalog',providerHelp:'First model setup: copy the model API key in the native manager into Aide’s encrypted model-provider settings only. No duplicate diagnostic key is needed. A catalog is not inference acceptance; send a separate test message.',advancedTitle:'Advanced and troubleshooting',advancedHelp:'Keep connection mode on Automatic in plugin settings. Native and Docker Desktop use their corresponding local addresses. Older managers need updating to this plugin version. Linux Docker requires controlled host connectivity.',disconnect:'Disconnect this Aide backend',scope:'Text, SSE, tool handoff and bounded concurrency. No desktop chat inheritance or images/audio. Login tokens, providers and firewall settings are not modified.',legacy:'Legacy secret settings exist. This version never reads or forwards them. Remove bridgeKey and managerKey from the text view of plugin settings; upgrades do not silently erase old settings.',checking:'Checking local connection…',manager_missing:'Native manager not found. Complete step 1 first.',unpaired:'Manager found. Complete step 2 to connect.',reconnect:'Connection unavailable. Open the manager or generate a new connection code.',host_missing:'Connected. Install/update the host, then start it.',host_stopped:'Connected; the bridge is stopped.',external_bridge:'An externally started bridge is present. Close it once before manager takeover.',ready:'Bridge running. Read the model catalog next; inference has not been tested.',working:'Working…',done:'Operation completed.',paired:'Connected.',modelResult:'Catalog: ',noModels:'No models returned.',approval:'Confirm the operation in Aide first; it has not run.'}};
const el=id=>document.getElementById(id),t=()=>copy[zh?'zh':'en'];
const ops=[['install','Install/update','安装／更新'],['start','Start','启动'],['stop','Stop','停止'],['restart','Restart','重启'],['doctor','Diagnose','诊断'],['repair','Repair launchers','修复启动器'],['uninstall','Uninstall host','卸载宿主']];
function controls(){for(const b of el('hostActions').children){const a=b.dataset.action;b.disabled=busy||!current.paired||(current.externalBridge&&a!=='doctor')||((a==='install'||a==='uninstall')&&current.running)||(a!=='install'&&!current.installed)||(a==='start'&&current.running)}el('models').disabled=busy||!current.paired||!current.running;el('pair').disabled=busy;el('refresh').disabled=busy;el('disconnect').disabled=busy||!current.paired;}
function paint(){if(current.phase!=='ready'){modelIDs=null;el('catalog').textContent=''}if([copy.zh.done,copy.en.done].includes(el('result').textContent))el('result').textContent=t().done;if(modelIDs)el('catalog').textContent=modelIDs.length?t().modelResult+modelIDs.join(', '):t().noModels;document.documentElement.lang=zh?'zh-CN':'en';el('lang').textContent=zh?'English':'中文';for(const id of ['intro','installTitle','installHelp','osLabel','installNote','pairTitle','pairHelp','pair','refresh','pairNote','hostTitle','hostHelp','modelsTitle','modelsHelp','models','providerHelp','advancedTitle','advancedHelp','disconnect','scope','legacy'])el(id).textContent=t()[id];if(current.paired){el('intro').textContent=zh?'Codex 已与当前 Aide 连接，可以直接检查和维护桥接。':'Codex is connected to this Aide backend. Inspect and maintain the bridge here.';el('hostTitle').textContent=zh?'宿主维护':'Host controls'}el('state').textContent=t()[current.phase]||current.message||t().reconnect;el('details').textContent=JSON.stringify(current,null,2);el('legacy').hidden=!current.legacySecretSettings;el('pairStep').hidden=!!current.paired;el('installStep').hidden=!!(current.paired&&current.installed);el('hostActions').replaceChildren();for(const [action,en,cn]of ops){const b=document.createElement('button');b.textContent=zh?cn:en;b.dataset.action=action;b.onclick=()=>perform(action);el('hostActions').append(b)}downloads();controls();}
function downloads(){const os=el('hostOS').value;el('downloads').replaceChildren();for(const [arch,name]of os==='darwin'?[['arm64','Apple Silicon'],['amd64','Intel']]:[['amd64','x64'],['arm64','ARM64']]){const a=document.createElement('a');a.textContent=(zh?'下载 ':'Download ')+name;a.href='https://github.com/skyelan1999/aide-pkg-CodexBridge/releases/download/v__BRIDGE_VERSION__/codex-bridge-manager-__BRIDGE_VERSION__-'+os+'-'+arch+(os==='linux'?'.tar.gz':'.zip');a.target='_blank';a.rel='noopener noreferrer';el('downloads').append(a)}}
async function call(tool,args={}){const r=await client.call(tool,args);if(r.status==='proposal')throw Error(t().approval);const raw=r.result??r.content??r;return typeof raw==='string'?JSON.parse(raw):raw;}
async function refresh(){current=await call('codex_bridge_manager_status');paint()}
async function work(fn){if(busy)return;busy=true;controls();el('result').textContent=t().working;try{await fn();el('result').textContent=t().done}catch(e){const message=e.message;try{await refresh()}catch{}el('result').textContent=message}finally{busy=false;controls()}}
async function perform(action){if(action==='uninstall'&&!confirm(zh?'卸载桥接程序？配置、模型密钥和管理器会保留。':'Remove bridge program files and retain settings, model key and manager?'))return;await work(async()=>{await call('codex_bridge_host_action',{action});await refresh()})}
el('pairForm').onsubmit=event=>{event.preventDefault();work(async()=>{const code=el('code').value;el('code').value='';try{await call('codex_bridge_pair',{code});await refresh()}finally{el('code').value=''}})};
el('refresh').onclick=()=>work(refresh);el('models').onclick=()=>work(async()=>{const d=await call('codex_bridge_models');modelIDs=d.models.map(m=>m.id);el('catalog').textContent=modelIDs.length?t().modelResult+modelIDs.join(', '):t().noModels});el('disconnect').onclick=()=>work(async()=>{await call('codex_bridge_disconnect');await refresh()});el('lang').onclick=()=>{zh=!zh;paint()};el('hostOS').value=/Mac/i.test(navigator.platform)?'darwin':/Win/i.test(navigator.platform)?'windows':'linux';el('hostOS').onchange=downloads;paint();refresh().catch(e=>{current={phase:'reconnect',paired:false,message:e.message};paint();el('result').textContent=e.message});
</script></html>
