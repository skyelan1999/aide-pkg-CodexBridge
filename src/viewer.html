<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Bridge</title>
<style>:root{color-scheme:light dark;--bg:#f6f8fb;--panel:#fff;--fg:#26364b;--muted:#64748b;--line:#d8e1ed;--accent:#476c93}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:28px;margin:0}h2{font-size:17px}small,p{color:var(--muted)}section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0}button{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:9px 16px;border-radius:9px;cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap}pre{overflow:auto;padding:14px;background:var(--bg);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}code{font-size:12px}li{margin:10px 0}.pill{font-size:11px;letter-spacing:.1em;color:var(--accent)}#status{white-space:pre-wrap;overflow-wrap:anywhere}a{color:var(--accent)}@media(prefers-color-scheme:dark){:root{--bg:#131d28;--panel:#1c2938;--fg:#e1e9f3;--muted:#a6b4c8;--line:#34475d;--accent:#9db9dc}}@media(max-width:500px){main{padding:18px 12px}section{padding:16px}header{align-items:start}h1{font-size:23px}}</style>
<main><header><div><div class="pill">LOCAL MODEL ADAPTER · 0.1.1</div><h1>Codex Bridge</h1></div><button id="lang" aria-label="切换语言 / Change language">中文</button></header><p id="intro"></p>
<section><h2 id="connectTitle"></h2><div class="actions"><button id="check"></button><button id="models"></button></div><p id="status" role="status" aria-live="polite"></p><pre id="output" hidden></pre></section>
<section><h2 id="guideTitle"></h2><p id="keyHelp"></p><pre id="keyCommands"></pre><ol id="guide"></ol></section><section><h2 id="scopeTitle"></h2><p id="scope"></p></section></main>
<script>/* HOST_CLIENT */</script><script>
'use strict';let zh=false,busy=false;const client=AideWorkbenchClient.create('codex-bridge');
const texts={en:{intro:'Connect Aide to Codex installed on your own host. The plugin guides setup; a separate local service performs protocol conversion.',connectTitle:'Connection & model catalog',check:'Check connection',models:'Read model catalog',guideTitle:'Get started',scopeTitle:'What this bridge does',scope:'Text, SSE, JSON output, function-tool handoff and bounded concurrent requests. Each request has an isolated temporary Codex thread. Aide owns history, tools and approval. Images/audio and desktop chat inheritance are not supported. Model catalog ≠ entitlement; successful inference is the access test.',guide:['Install Node.js 18+ and the official Codex CLI on the host. Run <code>codex login</code> there. No login tokens are copied by this plugin.','Extract the plugin ZIP. Windows: <code>install.cmd</code>; macOS: <code>sh install.command</code>; Linux: <code>sh install.sh</code>. Open the printed installation directory.','Run <code>node manage.cjs doctor</code>. Edit <code>config.json</code> if needed, then run <code>start.cmd</code> or <code>sh start.sh</code>. Keep that terminal open. Ctrl+C stops only the bridge.','Native Aide: <code>http://127.0.0.1:8787/v1</code>. Docker Desktop Aide: <code>http://host.docker.internal:8787/v1</code>. Docker access may require explicit host binding/firewall configuration; see README. The plugin never changes networking.','Run <code>node manage.cjs key</code> locally. Put the generated bridge key in Aide model-provider settings (OpenAI compatible / Chat Completions). Optionally set the same diagnostic key in plugin settings for catalog checks. Never paste a key into chat.','Choose a model from the authenticated catalog, then send a small test message in Aide. No provider is changed automatically. Ten concurrent slots share the same account quota; they do not guarantee tenfold speed.']},zh:{intro:'把宿主机上的 Codex 接入 Aide。插件负责连接检查与配置引导，独立本地服务负责协议转换。',connectTitle:'连接与模型目录',check:'检查连接',models:'读取模型目录',guideTitle:'如何使用',scopeTitle:'能力边界',scope:'支持文本、SSE、JSON 输出、函数工具交接和有界并发。每次请求使用独立临时 Codex 会话，历史、工具及审批由 Aide 管理。不继承桌面聊天，不支持图片和音频。模型目录不代表调用权限，实际推理成功才算通过。',guide:['宿主机安装 Node.js 18+ 和官方 Codex CLI，并在宿主机执行 <code>codex login</code>。插件不复制登录令牌。','解压插件 ZIP。Windows 运行 <code>install.cmd</code>；macOS 运行 <code>sh install.command</code>；Linux 运行 <code>sh install.sh</code>。进入输出的安装目录。','运行 <code>node manage.cjs doctor</code>，按需编辑 <code>config.json</code>，再运行 <code>start.cmd</code> 或 <code>sh start.sh</code>。保持终端打开，Ctrl+C 停止桥接。','原生 Aide：<code>http://127.0.0.1:8787/v1</code>；Docker Desktop：<code>http://host.docker.internal:8787/v1</code>。容器访问可能需要手工设置监听和防火墙，详见 README；插件不自动改变网络。','在安装目录运行 <code>node manage.cjs key</code>，把生成的桥接密钥填到 Aide 模型提供商设置（OpenAI 兼容 / Chat Completions）。插件设置里的诊断密钥仅用于读取目录，不要把密钥发到聊天中。','从认证目录选择模型，再在 Aide 发一条简短测试消息。插件不自动更改提供商。十路并发共享账号额度，不等于十倍速度。']}};
const keyCommands = `Windows (CMD):
node "%LOCALAPPDATA%\\aide-codex-bridge\\manage.cjs" key

macOS (Terminal):
node "$HOME/Library/Application Support/aide-codex-bridge/manage.cjs" key

Linux (Terminal):
node "\${XDG_DATA_HOME:-$HOME/.local/share}/aide-codex-bridge/manage.cjs" key

Installed directory / 安装目录:
Windows: get-key.cmd
macOS: sh get-key.command
Linux: sh get-key.sh`;
function paint(){document.getElementById('keyHelp').textContent=zh?'先在运行 Codex 的宿主机安装，再按对应系统获取密钥。仅导入 Aide 插件不会安装宿主服务。':'Install on the Codex host first, then use the command for that OS. Importing the Aide plugin alone does not install the host service.';document.getElementById('keyCommands').textContent=keyCommands;const t=texts[zh?'zh':'en'];document.documentElement.lang=zh?'zh-CN':'en';for(const id of ['intro','connectTitle','check','models','guideTitle','scopeTitle','scope'])document.getElementById(id).textContent=t[id];document.getElementById('lang').textContent=zh?'English':'中文';document.getElementById('guide').innerHTML=t.guide.map(x=>'<li>'+x+'</li>').join('');}
async function run(tool){if(busy)return;busy=true;for(const id of ['check','models'])document.getElementById(id).disabled=true;const o=document.getElementById('output');o.hidden=true;o.textContent='';document.getElementById('status').textContent=zh?'检查中…':'Checking…';try{const r=await client.call(tool,{});if(r.status==='proposal')throw Error('Approval required in Aide');const raw=r.result??r.content??r;const value=typeof raw==='string'?JSON.parse(raw):raw;o.textContent=JSON.stringify(value,null,2);o.hidden=false;document.getElementById('status').textContent=zh?'检查完成（不代表推理验证通过）':'Check complete (not inference acceptance)';}catch(e){document.getElementById('status').textContent=e.message;}finally{busy=false;for(const id of ['check','models'])document.getElementById(id).disabled=false;}}
document.getElementById('lang').onclick=()=>{zh=!zh;paint()};document.getElementById('check').onclick=()=>run('codex_bridge_connection_info');document.getElementById('models').onclick=()=>run('codex_bridge_models');paint();
</script></html>
